# Runs the weekly model, logs the picks, and publishes the site to GitHub Pages.
# Times are UTC. Eastern is UTC-4 until Nov 1, 2026, then UTC-5 (runs land an hour earlier ET).
name: Weekly lines

on:
  schedule:
    - cron: "0 14 * * 2"    # Tue 10:00 ET  - opening look
    - cron: "0 20 * * 4"    # Thu 16:00 ET  - before Thursday night
    - cron: "0 20 * * 5"    # Fri 16:00 ET  - after final injury reports
    - cron: "30 15 * * 0"   # Sun 11:30 ET  - ~90 min before 1 p.m. games (inactives)
    - cron: "0 19 * * 0"    # Sun 15:00 ET  - before late games
    - cron: "0 21 * * 1"    # Mon 17:00 ET  - before Monday night
  workflow_dispatch:
    inputs:
      refresh:
        description: "Force re-download of current-season data"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nfl-model
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache key (one per ISO week)
        id: wk
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore nflverse data cache
        uses: actions/cache@v4
        with:
          path: data_cache
          key: nflverse-${{ steps.wk.outputs.week }}
          restore-keys: nflverse-

      - name: Run model for the next unplayed week
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python run_week.py ${{ inputs.refresh && '--refresh' || '' }}

      - name: Line watch (scores, DraftKings line history)
        run: python line_watch.py

      - name: Build site
        run: python build_site.py

      - name: Save picks, odds and line history to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts site_data
          if git diff --cached --quiet; then echo "Nothing new to commit"; exit 0; fi
          git commit -m "Weekly run $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
