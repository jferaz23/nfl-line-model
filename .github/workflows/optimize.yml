# Re-runs the backtest each week so calibration (blend weights, pruning, line-movement model)
# learns from last week's results. A full retune (slow) can be started by hand from the Actions tab.
name: Recalibrate

on:
  schedule:
    - cron: "0 9 * * 2"     # Tue 05:00 ET, after Monday night, before the Tuesday run
  workflow_dispatch:
    inputs:
      full_tune:
        description: "Also retune rating/QB memory settings (much slower)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nfl-model
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache key (one per ISO week)
        id: wk
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore nflverse data cache
        uses: actions/cache@v4
        with:
          path: data_cache
          key: nflverse-${{ steps.wk.outputs.week }}
          restore-keys: nflverse-

      - name: Backtest and calibrate
        run: python optimize.py ${{ !inputs.full_tune && '--skip-tune' || '' }}

      - name: Add last week's games to the wind-unders record
        continue-on-error: true
        run: python -m nflmodel.wind --update

      - name: Save calibration to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts
          if git diff --cached --quiet; then echo "Nothing new to commit"; exit 0; fi
          git commit -m "Recalibrate $(date -u +'%Y-%m-%d')"
          git -c rebase.autoStash=true pull --rebase -X theirs
          git push
